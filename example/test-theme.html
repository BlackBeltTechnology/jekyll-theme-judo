<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Test - Example Site</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">
                <span>Theme Test</span>
            </a>
            <nav class="nav" id="site-nav">
                <label class="theme-toggle" aria-label="Toggle dark mode">
                    <input type="checkbox" id="theme-toggle" />
                    <span class="theme-toggle-slider"></span>
                    <span class="theme-toggle-icons">
                        <span class="theme-icon-light">☀️</span>
                        <span class="theme-icon-dark">🌙</span>
                    </span>
                </label>
            </nav>
        </div>
    </header>
    
    <main class="container" style="padding: 2rem 0;">
        <h1>Theme Test Page</h1>
        <div class="card">
            <h3>Test Card</h3>
            <p>This card should change colors with the theme.</p>
            <p>Current theme: <span id="current-theme">light</span></p>
        </div>
        
        <div class="hero-cta">
            <a href="#" class="btn btn-primary">Primary Button</a>
            <a href="#" class="btn btn-secondary">Secondary Button</a>
        </div>
    </main>
    
    <script src="/assets/js/main.js"></script>
    <script>
        // Additional test script to verify theme is working
        document.addEventListener('DOMContentLoaded', function() {
            const themeDisplay = document.getElementById('current-theme');
            const updateThemeDisplay = () => {
                themeDisplay.textContent = document.documentElement.getAttribute('data-theme') || 'light';
            };
            
            // Initial update
            updateThemeDisplay();
            
            // Watch for theme changes
            const observer = new MutationObserver(updateThemeDisplay);
            observer.observe(document.documentElement, { 
                attributes: true, 
                attributeFilter: ['data-theme'] 
            });
        });
    </script>
</body>
</html>
